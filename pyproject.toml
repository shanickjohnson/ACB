[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "google-genai",
    "python-dotenv",
    "python-multipart",
    "requests",
    "beautifulsoup4",
    "langgraph",
    "langgraph-checkpoint-sqlite",
]

[tool.setuptools.packages.find]
where = ["src"]
